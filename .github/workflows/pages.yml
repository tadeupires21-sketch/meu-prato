name: Testar e publicar no GitHub Pages
# Todos os roteiros de testes/ (npm run test:e2e) rodam em todo pull request e em todo push na main.
# A publicação só acontece na main e só depois que todos passam: falhou um, não publica.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Testes (12 roteiros)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências (lockfile)
        run: npm ci
      # Sem --with-deps: as bibliotecas do Chromium já vêm na imagem do runner, e o apt-get do --with-deps
      # (só fontes extras) falhou por DNS do espelho do Ubuntu em 11/11/2026, bloqueando a publicação.
      - name: Instalar Chromium do Playwright
        run: npx playwright install chromium
      - name: Executar todos os roteiros
        run: npm run test:e2e
      - name: Guardar capturas e backup do teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-e2e
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
  deploy:
    name: Publicar
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Montar o site só com os arquivos do app
        run: |
          mkdir _site
          cp -r index.html js styles.css sw.js manifest.webmanifest icons _site/
          rm -f _site/js/package.json
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
